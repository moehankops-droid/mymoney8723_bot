<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nono Money Tracker</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            padding: 15px;
            text-align: center;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #2e7d32;
        }
        h2 { margin-top: 0; font-size: 20px; }
        h1 { font-size: 26px; margin: 10px 0; }
        
        .month-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2c2c2c;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .month-selector button {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 10px;
        }
        .day-box {
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px 0;
            font-size: 14px;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
        }
        .day-box.saved {
            background-color: #2e7d32;
            border-color: #4CAF50;
            color: white;
            font-weight: bold;
        }
        .day-box.has-note::after {
            content: '';
            position: absolute;
            top: 3px;
            right: 3px;
            width: 6px;
            height: 6px;
            background-color: #ff9800;
            border-radius: 50%;
        }

        /* Modal Popup Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            border: 1px solid #444;
            text-align: left;
        }
        .modal-content input[type="number"], .modal-content textarea {
            width: 100%;
            background-color: #2c2c2c;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 8px;
            margin-top: 8px;
            box-sizing: border-box;
        }
        .modal-content textarea {
            height: 70px;
            resize: none;
            margin-top: 10px;
        }
        .modal-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        .modal-buttons button {
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-save { background-color: #2e7d32; color: white; }
        .btn-close { background-color: #555; color: white; }
    </style>
</head>
<body>

    <div class="card">
        <h2>💰 Nono Money စုငွေစာရင်း</h2>
        <p style="font-size: 13px; color: #aaa;">ရက်ကိုနှိပ်၍ ငွေပမာဏ (ကြက်ဥဖိုး/စုငွေ) ထည့်သွင်းနိုင်သည်</p>
    </div>

    <!-- လအလိုက် ရွေးချယ်ရန် -->
    <div class="card">
        <div class="month-selector">
            <button onclick="changeMonth(-1)">◀ ပြီးခဲ့သော</button>
            <h3 id="current-month-title" style="margin: 0;">January</h3>
            <button onclick="changeMonth(1)">နောက်လာမည့် ▶</button>
        </div>

        <h3>ယခုလ စုပြီးသား ပမာဏ</h3>
        <h1 id="total-savings" style="color: #4CAF50;">0 ကျပ်</h1>
        <p>စုစုပေါင်း သွင်းငွေကြိမ်ရေ: <span id="total-days">0</span> ကြိမ်</p>
    </div>

    <div class="card">
        <h3 id="calendar-title">📅 ကယ်လင်ဒါ</h3>
        <p style="font-size: 12px; color: #aaa;">ရက်ကွက်များကို နှိပ်၍ ငွေပမာဏနှင့် မှတ်စုများ ထည့်နိုင်သည်</p>
        <div class="calendar-grid" id="calendar"></div>
    </div>

    <!-- Note & Amount Modal Popup -->
    <div class="modal" id="noteModal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top: 0; font-size: 18px;">ရက်စွဲ စာရင်းသွင်းရန်</h3>
            
            <label style="font-size: 13px; color: #ccc;">💰 ထည့်မည့် ငွေပမာဏ (ကျပ်)</label>
            <input type="number" id="modal-amount-input" placeholder="ဥပမာ - 1000 သို့မဟုတ် 5000">

            <label style="font-size: 13px; color: #ccc; display: block; margin-top: 10px;">📝 မှတ်စု / အကြောင်းအရာ</label>
            <textarea id="modal-note-text" placeholder="ဥပမာ - ကြက်ဥရောင်းရငွေ၊ စုငွေ..."></textarea>
            
            <div class="modal-buttons">
                <button class="btn-close" onclick="closeModal()">ပိတ်မည်</button>
                <button class="btn-save" onclick="saveModalData()">သိမ်းမည်</button>
            </div>
        </div>
    </div>

    <script>
        const months = [
            { name: "January", days: 31 },
            { name: "February", days: 28 },
            { name: "March", days: 31 },
            { name: "April", days: 30 },
            { name: "May", days: 31 },
            { name: "June", days: 30 },
            { name: "July", days: 31 },
            { name: "August", days: 31 },
            { name: "September", days: 30 },
            { name: "October", days: 31 },
            { name: "November", days: 30 },
            { name: "December", days: 31 }
        ];

        let currentMonthIndex = parseInt(localStorage.getItem('nonoCurrentMonth')) || 0;
        let savedData = JSON.parse(localStorage.getItem('nonoMoneyData')) || {};
        let notesData = JSON.parse(localStorage.getItem('nonoNotesData')) || {};
        let amountsData = JSON.parse(localStorage.getItem('nonoAmountsData')) || {};

        let activeDayForModal = null;

        function changeMonth(direction) {
            currentMonthIndex += direction;
            if (currentMonthIndex < 0) currentMonthIndex = 11;
            if (currentMonthIndex > 11) currentMonthIndex = 0;
            localStorage.setItem('nonoCurrentMonth', currentMonthIndex);
            renderCalendar();
        }

        function renderCalendar() {
            const monthObj = months[currentMonthIndex];
            document.getElementById("current-month-title").innerText = monthObj.name;
            document.getElementById("calendar-title").innerText = `📅 ${monthObj.name} ကယ်လင်ဒါ`;

            const calendarEl = document.getElementById('calendar');
            calendarEl.innerHTML = '';

            let monthKey = monthObj.name;
            if (!amountsData[monthKey]) amountsData[monthKey] = {};
            if (!notesData[monthKey]) notesData[monthKey] = {};

            let currentMonthAmounts = amountsData[monthKey];
            let currentMonthNotes = notesData[monthKey];

            let currentTotalMoney = 0;
            let activeDaysCount = 0;

            for (let i = 1; i <= monthObj.days; i++) {
                const dayBox = document.createElement('div');
                dayBox.classList.add('day-box');
                dayBox.innerText = i;

                if (currentMonthAmounts[i] && currentMonthAmounts[i] > 0) {
                    dayBox.classList.add('saved');
                    currentTotalMoney += currentMonthAmounts[i];
                    activeDaysCount++;
                }

                if (currentMonthNotes[i] && currentMonthNotes[i].trim() !== "") {
                    dayBox.classList.add('has-note');
                }

                dayBox.onclick = function() {
                    openModal(monthKey, i);
                };

                calendarEl.appendChild(dayBox);
            }

            document.getElementById("total-savings").innerText = currentTotalMoney.toLocaleString() + " ကျပ်";
            document.getElementById("total-days").innerText = activeDaysCount;
        }

        function openModal(monthKey, day) {
            activeDayForModal = { monthKey, day };
            const monthAmounts = amountsData[monthKey] || {};
            const monthNotes = notesData[monthKey] || {};

            document.getElementById("modal-title").innerText = `${monthKey} လ၊ ရက်စွဲ (${day})`;
            document.getElementById("modal-amount-input").value = monthAmounts[day] || "";
            document.getElementById("modal-note-text").value = monthNotes[day] || "";

            document.getElementById("noteModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("noteModal").style.display = "none";
        }

        function saveModalData() {
            if (!activeDayForModal) return;
            const { monthKey, day } = activeDayForModal;

            const amountVal = parseFloat(document.getElementById("modal-amount-input").value) || 0;
            const noteText = document.getElementById("modal-note-text").value;

            // ငွေပမာဏ သိမ်းရန်
            if (!amountsData[monthKey]) amountsData[monthKey] = {};
            if (amountVal > 0) {
                amountsData[monthKey][day] = amountVal;
            } else {
                delete amountsData[monthKey][day];
            }

            // မှတ်စု သိမ်းရန်
            if (!notesData[monthKey]) notesData[monthKey] = {};
            if (noteText.trim() !== "") {
                notesData[monthKey][day] = noteText;
            } else {
                delete notesData[monthKey][day];
            }

            localStorage.setItem('nonoAmountsData', JSON.stringify(amountsData));
            localStorage.setItem('nonoNotesData', JSON.stringify(notesData));

            closeModal();
            renderCalendar();
        }

        // ဖိုင်စတင်ဖွင့်လိုက်သည်နှင့် ကယ်လင်ဒါကို ဖော်ပြပေးရန်
        renderCalendar();
    </script>

</body>
</html>
