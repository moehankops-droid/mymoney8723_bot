<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nono Money Tracker</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            padding: 15px;
            text-align: center;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #2e7d32;
        }
        h2 { margin-top: 0; font-size: 20px; }
        h1 { font-size: 26px; margin: 10px 0; }
        
        .month-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2c2c2c;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .month-selector button {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 10px;
        }
        .day-box {
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px 0;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .day-box.saved {
            background-color: #2e7d32;
            border-color: #4CAF50;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>💰 Nono Money စုငွေစာရင်း</h2>
        <p style="font-size: 13px; color: #aaa;">တစ်ရက် = ၁,၀၀၀ ကျပ်</p>
    </div>

    <!-- လအလိုက် ရွေးချယ်ရန် -->
    <div class="card">
        <div class="month-selector">
            <button onclick="changeMonth(-1)">◀ ပြီးခဲ့သော</button>
            <h3 id="current-month-title" style="margin: 0;">January</h3>
            <button onclick="changeMonth(1)">နောက်လာမည့် ▶</button>
        </div>

        <h3>ယခုလ စုပြီးသား ပမာဏ</h3>
        <h1 id="total-savings" style="color: #4CAF50;">0 ကျပ်</h1>
        <p>စုစုပေါင်း ရက်: <span id="total-days">0</span> ရက်</p>
    </div>

    <div class="card">
        <h3 id="calendar-title">📅 ကယ်လင်ဒါ</h3>
        <p style="font-size: 12px; color: #aaa;">စုပြီးသောရက်များကို နှိပ်ပါ</p>
        <div class="calendar-grid" id="calendar"></div>
    </div>

    <script>
        const months = [
            { name: "January", days: 31 },
            { name: "February", days: 28 },
            { name: "March", days: 31 },
            { name: "April", days: 30 },
            { name: "May", days: 31 },
            { name: "June", days: 30 },
            { name: "July", days: 31 },
            { name: "August", days: 31 },
            { name: "September", days: 30 },
            { name: "October", days: 31 },
            { name: "November", days: 30 },
            { name: "December", days: 31 }
        ];

        // localStorage ထဲကနေ နောက်ဆုံးကြည့်ခဲ့တဲ့ လကို ပြန်ဖတ်မယ် (မရှိရင် 0 လို့ ယူမယ်)
        let currentMonthIndex = parseInt(localStorage.getItem('nonoCurrentMonth')) || 0;
        let savedData = JSON.parse(localStorage.getItem('nonoMoneyData')) || {};

        function changeMonth(direction) {
            currentMonthIndex += direction;
            if (currentMonthIndex < 0) currentMonthIndex = 11;
            if (currentMonthIndex > 11) currentMonthIndex = 0;
            
            // ရွေးလိုက်တဲ့ လကို မှတ်ထားမယ်
            localStorage.setItem('nonoCurrentMonth', currentMonthIndex);
            renderCalendar();
        }

        function renderCalendar() {
            const monthObj = months[currentMonthIndex];
            document.getElementById("current-month-title").innerText = monthObj.name;
            document.getElementById("calendar-title").innerText = `📅 ${monthObj.name} ကယ်လင်ဒါ`;

            const calendarEl = document.getElementById('calendar');
            calendarEl.innerHTML = '';

            let monthKey = monthObj.name;
            if (!savedData[monthKey]) {
                savedData[monthKey] = [];
            }

            let currentMonthSaved = savedData[monthKey];
            let currentTotalMoney = currentMonthSaved.length * 1000;
            let activeDaysCount = currentMonthSaved.length;

            for (let i = 1; i <= monthObj.days; i++) {
                const dayBox = document.createElement('div');
                dayBox.classList.add('day-box');
                dayBox.innerText = i;

                if (currentMonthSaved.includes(i)) {
                    dayBox.classList.add('saved');
                }

                dayBox.onclick = function() {
                    toggleDay(monthKey, i);
                };

                calendarEl.appendChild(dayBox);
            }

            document.getElementById("total-savings").innerText = currentTotalMoney.toLocaleString() + " ကျပ်";
            document.getElementById("total-days").innerText = activeDaysCount;
        }

        function toggleDay(monthKey, day) {
            let monthSaved = savedData[monthKey];
            const index = monthSaved.indexOf(day);
            if (index > -1) {
                monthSaved.splice(index, 1);
            } else {
                monthSaved.push(day);
            }
            localStorage.setItem('nonoMoneyData', JSON.stringify(savedData));
            renderCalendar();
        }

        renderCalendar();
    </script>

</body>
</html>
