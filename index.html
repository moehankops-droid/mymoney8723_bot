<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nono Money Tracker</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            padding: 15px;
            text-align: center;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #2e7d32;
        }
        h2 { margin-top: 0; font-size: 20px; }
        h1 { font-size: 22px; margin: 8px 0; }
        
        .month-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2c2c2c;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .month-selector button {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .summary-box {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .summary-card {
            flex: 1;
            background-color: #1e1e1e;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #444;
            text-align: center;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 10px;
        }
        .day-box {
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px 0;
            font-size: 14px;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
        }
        .day-box.saved {
            background-color: #2e7d32;
            border-color: #4CAF50;
            color: white;
            font-weight: bold;
        }
        .day-box.has-note::after {
            content: '';
            position: absolute;
            top: 3px;
            right: 3px;
            width: 6px;
            height: 6px;
            background-color: #ff9800;
            border-radius: 50%;
        }

        /* Modal Popup Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            border: 1px solid #444;
            text-align: left;
        }
        .modal-content select, .modal-content input[type="number"], .modal-content textarea {
            width: 100%;
            background-color: #2c2c2c;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 8px;
            margin-top: 6px;
            box-sizing: border-box;
        }
        .modal-content textarea {
            height: 60px;
            resize: none;
            margin-top: 6px;
        }
        .modal-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        .modal-buttons button {
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-save { background-color: #2e7d32; color: white; }
        .btn-close { background-color: #555; color: white; }
    </style>
</head>
<body>

    <div class="card">
        <h2>💰 Nono Money & Business Tracker</h2>
        <p style="font-size: 12px; color: #aaa;">ကိုယ့်စုငွေနှင့် မိသားစု ကြက်ဥစီးပွားရေး စာရင်း</p>
    </div>

    <!-- လအလိုက် ရွေးချယ်ရန် -->
    <div class="card">
        <div class="month-selector">
            <button onclick="changeMonth(-1)">◀ ပြီးခဲ့သော</button>
            <h3 id="current-month-title" style="margin: 0;">January</h3>
            <button onclick="changeMonth(1)">နောက်လာမည့် ▶</button>
        </div>
    </div>

    <!-- သီးသန့် စုစုပေါင်းပြရန် ကတ်ပြားများ -->
    <div class="summary-box">
        <div class="summary-card">
            <p style="font-size: 12px; color: #aaa; margin:0;">⭐ ကိုယ့်စုငွေ/ရင်းနှီး</p>
            <h1 id="my-total" style="color: #4CAF50; font-size: 18px;">0 ကျပ်</h1>
        </div>
        <div class="summary-card">
            <p style="font-size: 12px; color: #aaa; margin:0;">🥚 မိသားစု ကြက်ဥငွေ</p>
            <h1 id="family-total" style="color: #ff9800; font-size: 18px;">0 ကျပ်</h1>
        </div>
    </div>

    <div class="card">
        <h3 id="calendar-title">📅 ကယ်လင်ဒါ</h3>
        <p style="font-size: 12px; color: #aaa;">ရက်ကိုနှိပ်၍ ငွေစာရင်း သီးသန့်ခွဲသွင်းပါ</p>
        <div class="calendar-grid" id="calendar"></div>
    </div>

    <!-- Note & Amount Modal Popup -->
    <div class="modal" id="noteModal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top: 0; font-size: 16px;">ရက်စွဲ စာရင်းသွင်းရန်</h3>
            
            <label style="font-size: 12px; color: #ccc;">📂 အမျိုးအစား ခွဲမည်</label>
            <select id="modal-category">
                <option value="personal">⭐ ကိုယ့်ရဲ့ စုငွေ/ရင်းနှီးငွေ</option>
                <option value="family">🥚 မိသားစု ကြက်ဥအရောင်း</option>
            </select>

            <label style="font-size: 12px; color: #ccc; display: block; margin-top: 8px;">💰 ငွေပမာဏ (ကျပ်)</label>
            <input type="number" id="modal-amount-input" placeholder="ပမာဏရိုက်ထည့်ရန်">

            <label style="font-size: 12px; color: #ccc; display: block; margin-top: 8px;">📝 မှတ်စု</label>
            <textarea id="modal-note-text" placeholder="အသေးစိတ် မှတ်ချက်..."></textarea>
            
            <div class="modal-buttons">
                <button class="btn-close" onclick="closeModal()">ပိတ်မည်</button>
                <button class="btn-save" onclick="saveModalData()">သိမ်းမည်</button>
            </div>
        </div>
    </div>

    <script>
        const months = [
            { name: "January", days: 31 }, { name: "February", days: 28 },
            { name: "March", days: 31 }, { name: "April", days: 30 },
            { name: "May", days: 31 }, { name: "June", days: 30 },
            { name: "July", days: 31 }, { name: "August", days: 31 },
            { name: "September", days: 30 }, { name: "October", days: 31 },
            { name: "November", days: 30 }, { name: "December", days: 31 }
        ];

        let currentMonthIndex = parseInt(localStorage.getItem('nonoCurrentMonth')) || 0;
        let transactionsData = JSON.parse(localStorage.getItem('nonoTransactionsData')) || {};
        let activeDayForModal = null;

        function changeMonth(direction) {
            currentMonthIndex += direction;
            if (currentMonthIndex < 0) currentMonthIndex = 11;
            if (currentMonthIndex > 11) currentMonthIndex = 0;
            localStorage.setItem('nonoCurrentMonth', currentMonthIndex);
            renderCalendar();
        }

        function renderCalendar() {
            const monthObj = months[currentMonthIndex];
            document.getElementById("current-month-title").innerText = monthObj.name;
            document.getElementById("calendar-title").innerText = `📅 ${monthObj.name} ကယ်လင်ဒါ`;

            const calendarEl = document.getElementById('calendar');
            calendarEl.innerHTML = '';

            let monthKey = monthObj.name;
            if (!transactionsData[monthKey]) transactionsData[monthKey] = {};

            let monthTrans = transactionsData[monthKey];

            let totalPersonal = 0;
            let totalFamily = 0;

            for (let i = 1; i <= monthObj.days; i++) {
                const dayBox = document.createElement('div');
                dayBox.classList.add('day-box');
                dayBox.innerText = i;

                if (monthTrans[i] && monthTrans[i].length > 0) {
                    dayBox.classList.add('saved');
                    
                    let hasNote = false;
                    monthTrans[i].forEach(item => {
                        if (item.category === 'personal') {
                            totalPersonal += item.amount;
                        } else {
                            totalFamily += item.amount;
                        }
                        if (item.note && item.note.trim() !== "") hasNote = true;
                    });

                    if (hasNote) {
                        dayBox.classList.add('has-note');
                    }
                }

                dayBox.onclick = function() {
                    openModal(monthKey, i);
                };

                calendarEl.appendChild(dayBox);
            }

            document.getElementById("my-total").innerText = totalPersonal.toLocaleString() + " ကျပ်";
            document.getElementById("family-total").innerText = totalFamily.toLocaleString() + " ကျပ်";
        }

        function openModal(monthKey, day) {
            activeDayForModal = { monthKey, day };
            document.getElementById("modal-title").innerText = `${monthKey} လ၊ ရက်စွဲ (${day}) စာရင်း`;
            
            document.getElementById("modal-amount-input").value = "";
            document.getElementById("modal-note-text").value = "";
            document.getElementById("modal-category").value = "personal";

            document.getElementById("noteModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("noteModal").style.display = "none";
        }

        function saveModalData() {
            if (!activeDayForModal) return;
            const { monthKey, day } = activeDayForModal;

            const category = document.getElementById("modal-category").value;
            const amountVal = parseFloat(document.getElementById("modal-amount-input").value) || 0;
            const noteText = document.getElementById("modal-note-text").value;

            if (amountVal <= 0) {
                alert("ကျေးဇူးပြု၍ ငွေပမာဏ မှန်ကန်စွာ ထည့်ပါ။");
                return;
            }

            if (!transactionsData[monthKey]) transactionsData[monthKey] = {};
            if (!transactionsData[monthKey][day]) transactionsData[monthKey][day] = [];

            transactionsData[monthKey][day].push({
                category: category,
                amount: amountVal,
                note: noteText
            });

            localStorage.setItem('nonoTransactionsData', JSON.stringify(transactionsData));

            closeModal();
            renderCalendar();
        }

        renderCalendar();
    </script>

</body>
</html>
