<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nono Money Tracker</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            padding: 15px;
            text-align: center;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #2e7d32;
        }
        h2 { margin-top: 0; font-size: 20px; }
        h1 { font-size: 26px; margin: 10px 0; }
        
        .month-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2c2c2c;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .month-selector button {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 10px;
        }
        .day-box {
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px 0;
            font-size: 14px;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
        }
        .day-box.saved {
            background-color: #2e7d32;
            border-color: #4CAF50;
            color: white;
            font-weight: bold;
        }
        .day-box.has-note::after {
            content: '';
            position: absolute;
            top: 3px;
            right: 3px;
            width: 6px;
            height: 6px;
            background-color: #ff9800;
            border-radius: 50%;
        }

        /* Modal Popup Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            border: 1px solid #444;
            text-align: left;
        }
        .modal-content textarea {
            width: 100%;
            height: 80px;
            background-color: #2c2c2c;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 8px;
            margin-top: 10px;
            box-sizing: border-box;
            resize: none;
        }
        .modal-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        .modal-buttons button {
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-save { background-color: #2e7d32; color: white; }
        .btn-close { background-color: #555; color: white; }
    </style>
</head>
<body>

    <div class="card">
        <h2>💰 Nono Money စုငွေစာရင်း</h2>
        <p style="font-size: 13px; color: #aaa;">တစ်ရက် = ၁,၀၀၀ ကျပ် | ရက်ကိုနှိပ်၍ ငွေစုရန် & မှတ်စုရေးရန်</p>
    </div>

    <!-- လအလိုက် ရွေးချယ်ရန် -->
    <div class="card">
        <div class="month-selector">
            <button onclick="changeMonth(-1)">◀ ပြီးခဲ့သော</button>
            <h3 id="current-month-title" style="margin: 0;">January</h3>
            <button onclick="changeMonth(1)">နောက်လာမည့် ▶</button>
        </div>

        <h3>ယခုလ စုပြီးသား ပမာဏ</h3>
        <h1 id="total-savings" style="color: #4CAF50;">0 ကျပ်</h1>
        <p>စုစုပေါင်း ရက်: <span id="total-days">0</span> ရက်</p>
    </div>

    <div class="card">
        <h3 id="calendar-title">📅 ကယ်လင်ဒါ</h3>
        <p style="font-size: 12px; color: #aaa;">ရက်ကွက်များကို နှိပ်၍ ငွေစုခြင်းနှင့် မှတ်စုများ (ရုံးပိတ်ရက် စသည်) ထည့်နိုင်သည်</p>
        <div class="calendar-grid" id="calendar"></div>
    </div>

    <!-- Note Modal Popup -->
    <div class="modal" id="noteModal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top: 0; font-size: 18px;">ရက်စွဲ မှတ်စု</h3>
            <label style="font-size: 13px; color: #ccc;">
                <input type="checkbox" id="modal-money-checkbox"> 💰 ဤရက်တွင် ငွေ 1,000 ကျပ် စုမည်
            </label>
            <textarea id="modal-note-text" placeholder="ဥပမာ - ရုံးပိတ်ရက်၊ အလုပ်သွားရန် စသည်..."></textarea>
            <div class="modal-buttons">
                <button class="btn-close" onclick="closeModal()">ပိတ်မည်</button>
                <button class="btn-save" onclick="saveModalData()">သိမ်းမည်</button>
            </div>
        </div>
    </div>

    <script>
        const months = [
            { name: "January", days: 31 },
            { name: "February", days: 28 },
            { name: "March", days: 31 },
            { name: "April", days: 30 },
            { name: "May", days: 31 },
            { name: "June", days: 30 },
            { name: "July", days: 31 },
            { name: "August", days: 31 },
            { name: "September", days: 30 },
            { name: "October", days: 31 },
            { name: "November", days: 30 },
            { name: "December", days: 31 }
        ];

        let currentMonthIndex = parseInt(localStorage.getItem('nonoCurrentMonth')) || 0;
        let savedData = JSON.parse(localStorage.getItem('nonoMoneyData')) || {};
        let notesData = JSON.parse(localStorage.getItem('nonoNotesData')) || {};

        let activeDayForModal = null;

        function changeMonth(direction) {
            currentMonthIndex += direction;
            if (currentMonthIndex < 0) currentMonthIndex = 11;
            if (currentMonthIndex > 11) currentMonthIndex = 0;
            localStorage.setItem('nonoCurrentMonth', currentMonthIndex);
            renderCalendar();
        }

        function renderCalendar() {
            const monthObj = months[currentMonthIndex];
            document.getElementById("current-month-title").innerText = monthObj.name;
            document.getElementById("calendar-title").innerText = `📅 ${monthObj.name} ကယ်လင်ဒါ`;

            const calendarEl = document.getElementById('calendar');
            calendarEl.innerHTML = '';

            let monthKey = monthObj.name;
            if (!savedData[monthKey]) savedData[monthKey] = [];
            if (!notesData[monthKey]) notesData[monthKey] = {};

            let currentMonthSaved = savedData[monthKey];
            let currentMonthNotes = notesData[monthKey];

            let currentTotalMoney = currentMonthSaved.length * 1000;
            let activeDaysCount = currentMonthSaved.length;

            for (let i = 1; i <= monthObj.days; i++) {
                const dayBox = document.createElement('div');
                dayBox.classList.add('day-box');
                dayBox.innerText = i;

                if (currentMonthSaved.includes(i)) {
                    dayBox.classList.add('saved');
                }

                // အကယ်၍ မှတ်စုရှိရင် အစက်လေးပြမယ်
                if (currentMonthNotes[i] && currentMonthNotes[i].trim() !== "") {
                    dayBox.classList.add('has-note');
                }

                dayBox.onclick = function() {
                    openModal(monthKey, i);
                };

                calendarEl.appendChild(dayBox);
            }

            document.getElementById("total-savings").innerText = currentTotalMoney.toLocaleString() + " ကျပ်";
            document.getElementById("total-days").innerText = activeDaysCount;
        }

        function openModal(monthKey, day) {
            activeDayForModal = { monthKey, day };
            const monthSaved = savedData[monthKey];
            const monthNotes = notesData[monthKey] || {};

            document.getElementById("modal-title").innerText = `${monthKey} လ၊ ရက်စွဲ (${day})`;
            document.getElementById("modal-money-checkbox").checked = monthSaved.includes(day);
            document.getElementById("modal-note-text").value = monthNotes[day] || "";

            document.getElementById("noteModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("noteModal").style.display = "none";
        }

        function saveModalData() {
            if (!activeDayForModal) return;
            const { monthKey, day } = activeDayForModal;

            const isChecked = document.getElementById("modal-money-checkbox").checked;
            const noteText = document.getElementById("modal-note-text").value;

            // ငွေစုစာရင်း update လုပ်ရန်
            let monthSaved = savedData[monthKey];
            const index = monthSaved.indexOf(day);
            if (isChecked && index === -1) {
                monthSaved.push(day);
            } else if (!isChecked && index > -1) {
                monthSaved.splice(index, 1);
            }

            // မှတ်စု update လုပ်ရန်
            if (!notesData[monthKey]) notesData[monthKey] = {};
            if (noteText.trim() !== "") {
                notesData[monthKey][day] = noteText;
            } else {
                delete notesData[monthKey][day];
            }

            localStorage.setItem('nonoMoneyData', JSON.stringify(savedData));
            localStorage.setItem('nonoNotesData', JSON.stringify(notesData));

            closeModal();
            renderCalendar();
        }
    </script>

</body>
</html>
